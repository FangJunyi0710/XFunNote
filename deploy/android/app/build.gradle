plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// 读取版本号（从 frontend/package.json）
def getVersionName() {
    def result = exec {
        commandLine 'python3', '../../../scripts/read_version.py'
    }
    return result.output.trim()
}

def getVersionCode(versionName) {
    def parts = versionName.split('\\.')
    def major = parts[0] as int
    def minor = parts[1] as int
    def patch = parts[2] as int
    return major * 10000 + minor * 100 + patch
}

def versionName = getVersionName()
def versionCode = getVersionCode(versionName)

android {
    namespace 'com.xfunnote.xfunnote'
    compileSdk 34

    defaultConfig {
        applicationId "com.xfunnote.xfunnote"
        minSdk 24
        targetSdk 34
        versionCode versionCode
        versionName versionName
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

python {
    version "3.11"
    pip {
        install "fastapi"
        install "uvicorn"
        install "starlette"
        install "pydantic"
        install "langchain"
        install "langchain-anthropic"
        install "langchain-core"
        install "typer"
        install "python-dotenv"
        install "future-uuid"
        install "fsrs"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.google.android.material:material:1.12.0'
}

// 将 Python 源码与前端构建产物并入 Chaquopy 的 python 源目录
task copyPythonSources(type: Copy) {
    from '../../../backend'
    into 'src/main/python/backend'
    from '../../../xfun'
    into 'src/main/python/xfun'
    from '../../../backend/embedded_server.py'
    into 'src/main/python/backend'
    from '../../../frontend/dist'
    into 'src/main/python/frontend/dist'
}

preBuild.dependsOn copyPythonSources
