plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 仓库根目录（deploy/android/../..）
ext.repoRoot = rootProject.projectDir.parentFile.parentFile

// 读取版本号（从 frontend/package.json）
ext.getVersionName = {
    def proc = ['python3', 'scripts/read_version.py'].execute(null, repoRoot)
    proc.waitFor()
    return proc.text.trim()
}

ext.getVersionCode = { versionName ->
    def parts = versionName.split('\\.')
    def major = parts[0] as int
    def minor = parts[1] as int
    def patch = parts[2] as int
    return major * 10000 + minor * 100 + patch
}

def verName = getVersionName()
def verCode = getVersionCode(verName)

android {
    namespace 'com.xfunnote.xfunnote'
    compileSdk 34

    defaultConfig {
        applicationId "com.xfunnote.xfunnote"
        minSdk 24
        targetSdk 34
        versionCode verCode
        versionName verName

        // :core 用到 java.time / java.nio.file（API<26），需库脱糖；方法数也会超 64k
        multiDexEnabled true

        // 仅保留 64 位 ARM（当前绝大多数真机）；如需兼容老旧 32 位设备再补 armeabi-v7a
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.google.android.material:material:1.12.0'

    // 三端共享：Kotlin 业务内核（传输无关，含 ApiService/ApiRouter/AppConfig）。
    // 由 composite build (settings 里 includeBuild '../../server') 解析为 :core 工程。
    implementation 'com.xfunnote:core:0.1.0'

    // :core 用到 java.time / java.nio.file，minSdk24 需库脱糖
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // SQLite JDBC 驱动（java.sql 运行时提供者）。
    // 注意：xerial 的 .so 是 glibc 版，Android bionic 上能否加载需真机验证，
    // 若失败再换 Willena(JitPack)/SQLDroid；此依赖主要用于让 assembleDebug 编译打包通过。
    runtimeOnly 'org.xerial:sqlite-jdbc:3.47.0.0'
}

// 将前端构建产物并入 Android assets（WebView 用 file:///android_asset/www/index.html 加载）
task copyFrontendToAssets(type: Copy) {
    from(new File(repoRoot, 'frontend/dist')) {
        into 'www'
    }
    into 'src/main/assets'
}

preBuild.dependsOn copyFrontendToAssets
