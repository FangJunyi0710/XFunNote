# XFunNote Nginx 站点配置
# 安装后：ln -sf /etc/nginx/sites-available/xfunnote /etc/nginx/sites-enabled/
# 证书路径为占位符，安装后请用 certbot 替换为真实证书

upstream xfunnote_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # HTTP 重定向到 HTTPS（若已配置证书）
    # 证书就绪前可暂时注释此行，直接用 HTTP 访问
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # 证书占位符 —— 安装后替换为 certbot 签发的证书
    ssl_certificate /etc/ssl/certs/placeholder.crt;
    ssl_certificate_key /etc/ssl/private/placeholder.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /opt/xfunnote/frontend/dist;
    index index.html;

    # 静态文件长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 兜底：非 /api/ 的路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理到 Gunicorn
    location /api/ {
        proxy_pass http://xfunnote_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}