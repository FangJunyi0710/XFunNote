services:
  xfunnote:
    build:
      context: .
      dockerfile: Dockerfile
    image: xfunnote:latest
    container_name: xfunnote
    restart: unless-stopped
    ports:
      # 对外 80；如需改端口改左侧，如 "8080:80"
      - "80:80"
    environment:
      # 首次启动若不设置，入口脚本会生成并写入 /data/.env
      # 也可在此显式指定：
      # ROOT_TOKEN: "sk-your-token"
      BACKEND_PORT: "80"
      SHOW_DOCS: "false"
    volumes:
      # SQLite 数据库 / .env / 备份 持久化
      - xfunnote-data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/80' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  xfunnote-data:
